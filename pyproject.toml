[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maximal-class-graph"
version = "0.2.0"
description = "Convert directed graphs to maximal-class families and enumerate graphs with a given family."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
matrix = ["numpy>=1.23"]
digraph = ["networkx>=2.8"]
test = ["pytest>=7", "numpy>=1.23", "networkx>=2.8"]

[project.urls]
Repository = "https://github.com/Bi-xuan/maximal_class_graph"
"Original R algorithms" = "https://github.com/Bi-xuan/maximal_class"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maximal_class_graph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
